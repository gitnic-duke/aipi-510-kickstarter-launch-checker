# CI (task T9): runs on every PR to main and every push to main.
# main's branch protection requires these checks to pass before merging.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skipped (but green) until the Dockerfile from T8 is on the branch.
      - name: Build image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t kickstarter-api:ci .

      - name: Smoke-test the API inside the image
        if: hashFiles('Dockerfile') != ''
        run: |
          docker run -d --name api -p 8080:8080 kickstarter-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8080/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
